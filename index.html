<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本200名城攻略 | 地图・盖章・营业・活动</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f8f9fa;
    --sidebar: #ffffff;
    --accent: #1a73e8;
    --accent-dark: #1557b0;
    --text: #202124;
    --muted: #5f6368;
    --border: #dadce0;
    --hover: #f1f3f4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Google Sans", "Hiragino Sans", "Noto Sans JP", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }
  #sidebar {
    width: 380px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
    z-index: 1000;
  }
  #sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: #fff;
  }
  #sidebar-header h1 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .updated { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
  #search {
    width: 100%;
    padding: 10px 12px 10px 36px;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    outline: none;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%235f6368" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>') no-repeat 10px center;
  }
  #search:focus { border-color: var(--accent); }
  .filters {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .filters select {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.85rem;
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .card {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .card:hover, .card.active {
    background: var(--hover);
    border-color: var(--border);
  }
  .card h3 {
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
  .stamp-item, .event-item {
    background: #e8f0fe;
    border-radius: 6px;
    padding: 8px 10px;
    margin: 4px 0;
    font-size: 0.85rem;
  }
  .event-item { background: #fff4e6; }
  .stamp-item .place, .event-item .title { font-weight: 500; }
  .stamp-item .time, .event-item .detail { color: var(--muted); font-size: 0.78rem; }
  .nav-btn, .link-btn {
    display: inline-block;
    margin-top: 4px;
    margin-right: 6px;
    padding: 4px 10px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 0.75rem;
    cursor: pointer;
    text-decoration: none;
  }
  .link-btn { background: #d97706; }
  .nav-btn:hover, .link-btn:hover { opacity: 0.9; }
  #map {
    flex: 1;
    height: 100%;
  }
  .notice {
    font-size: 0.75rem;
    color: var(--muted);
    padding: 8px 16px;
    background: #fff8e1;
    border-top: 1px solid var(--border);
  }
  @media (max-width: 768px) {
    body { flex-direction: column; }
    #sidebar { width: 100%; height: 45vh; }
    #map { height: 55vh; }
  }
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">
    <h1>🇯🇵 日本200名城</h1>
    <div class="updated">数据核对时间：2026年11月4日 · 每月1日自动更新</div>
    <input type="text" id="search" placeholder="搜索城名、编号、地点...">
    <div class="filters">
      <select id="region">
        <option value="">全部区域</option>
        <option value="北海道">北海道</option>
        <option value="東北">东北</option>
        <option value="関東">关东</option>
        <option value="甲信越">甲信越</option>
        <option value="北陸">北陆</option>
        <option value="東海">东海</option>
        <option value="近畿">近畿</option>
        <option value="中国">中国</option>
        <option value="四国">四国</option>
        <option value="九州">九州</option>
        <option value="沖縄">冲绳</option>
      </select>
      <select id="type">
        <option value="">全部</option>
        <option value="100">日本100名城</option>
        <option value="続">続100名城</option>
      </select>
    </div>
  </div>
  <div id="list"></div>
  <div class="notice">营业时间、盖章地点、活动会变动，出发前请确认官方。点击「导航」或活动链接可直接跳转。</div>
</div>
<div id="map"></div>

<script>
const LAST_UPDATED = "2026年11月4日";

const castles = [
  {no:2, name:"五棱郭", loc:"北海道函馆市", region:"北海道", type:"100", lat:41.796, lng:140.757,
   stamps:[{place:"箱馆奉行所附属「板库」入口附近", time:"10:00-17:00"}],
   hours:"约9:00-17:00（季节变动）", ticket:"奉行所有料", gojoin:"有",
   events:[{title:"樱花季", detail:"4-5月热闹", link:"https://www.hakodate.travel/"}],
   official:"https://www.goryokaku-tower.co.jp/", note:"星形城郭"},
  {no:4, name:"弘前城", loc:"青森县弘前市", region:"東北", type:"100", lat:40.607, lng:140.464,
   stamps:[{place:"弘前城情报馆", time:"9:00-17:00（樱花季可能延长）"}],
   hours:"天守约9:00-17:00", ticket:"天守有料", gojoin:"有",
   events:[{title:"樱花季", detail:"4月下旬-5月上旬最盛", link:"https://www.hirosaki-kanko.or.jp/"}],
   official:"https://www.hirosakipark.jp/", note:"现存天守"},
  {no:29, name:"松本城", loc:"长野县松本市", region:"甲信越", type:"100", lat:36.239, lng:137.969,
   stamps:[{place:"松本城管理事务所", time:"8:30-17:00"}, {place:"松本市观光信息中心", time:"请确认"}],
   hours:"约8:30-17:00", ticket:"成人约700-1000日元", gojoin:"有",
   events:[{title:"季节活动", detail:"常有夜景/特别展", link:"https://www.matsumoto-castle.jp/"}],
   official:"https://www.matsumoto-castle.jp/", note:"国宝现存天守"},
  {no:54, name:"大阪城", loc:"大阪府大阪市", region:"近畿", type:"100", lat:34.687, lng:135.526,
   stamps:[{place:"天守阁1楼案内柜台附近", time:"9:00-17:00（最终入馆提前）"}],
   hours:"天守约9:00-17:00/18:00", ticket:"成人约1200日元", gojoin:"有",
   events:[{title:"秋祭等", detail:"常有限定御城印", link:"https://www.osakacastle.net/"}],
   official:"https://www.osakacastle.net/", note:"公园免费"},
  {no:59, name:"姫路城", loc:"兵库县姫路市", region:"近畿", type:"100", lat:34.839, lng:134.694,
   stamps:[{place:"管理事务所入口（入城口横）", time:"9:00-16:00（夏季可延长）", closed:"12/29-30"}],
   hours:"9:00-17:00（最终入城16:00）", ticket:"成人约1000-2500日元", gojoin:"有",
   events:[{title:"特别展览/夜景", detail:"请查官网", link:"https://www.city.himeji.lg.jp/castle/"}],
   official:"https://www.city.himeji.lg.jp/castle/", note:"世界遗产・国宝"},
  {no:64, name:"松江城", loc:"岛根县松江市", region:"中国", type:"100", lat:35.475, lng:133.050,
   stamps:[{place:"天守或相关设施", time:"约8:30-17:00"}],
   hours:"天守约8:30-17:00", ticket:"成人约1200日元", gojoin:"有",
   events:[{title:"夜景活动", detail:"季节性", link:"https://www.matsue-castle.jp/"}],
   official:"https://www.matsue-castle.jp/", note:"国宝现存天守"},
  {no:73, name:"广岛城", loc:"广岛县广岛市", region:"中国", type:"100", lat:34.403, lng:132.459,
   stamps:[{place:"相关案内所 / 天守区域", time:"约9:00-17:00"}],
   hours:"约9:00-17:00", ticket:"天守有料", gojoin:"有",
   events:[{title:"宵めぐり2026", detail:"2026/12/18-2027/1/11 灯光+投影", link:"https://www.rijo-castle.jp/"}],
   official:"https://www.rijo-castle.jp/", note:"鲤城"},
  {no:92, name:"熊本城", loc:"熊本县熊本市", region:"九州", type:"100", lat:32.806, lng:130.706,
   stamps:[{place:"相关案内所", time:"确认最新"}],
   hours:"确认最新", ticket:"天守有料", gojoin:"有",
   events:[{title:"复原相关", detail:"注意开放状况", link:"https://castle.kumamoto-guide.jp/"}],
   official:"https://castle.kumamoto-guide.jp/", note:"地震后复原中"}
];

const map = L.map('map').setView([36.5, 138], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

const markers = {};
castles.forEach(c => {
  if (c.lat && c.lng) {
    const marker = L.marker([c.lat, c.lng]).addTo(map)
      .bindPopup(`<b>No.${c.no} ${c.name}</b><br>${c.loc}`);
    markers[c.no] = marker;
    marker.on('click', () => selectCastle(c.no));
  }
});

function selectCastle(no) {
  document.querySelectorAll('.card').forEach(el => el.classList.remove('active'));
  const card = document.querySelector(`.card[data-no="${no}"]`);
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  const c = castles.find(x => x.no === no);
  if (c && markers[no]) {
    map.setView([c.lat, c.lng], 13);
    markers[no].openPopup();
  }
}

function render(list) {
  const el = document.getElementById("list");
  if (list.length === 0) {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:#5f6368;">没有找到匹配的城</div>';
    return;
  }
  el.innerHTML = list.map(c => {
    const stampsHtml = (c.stamps || []).map(s => `
      <div class="stamp-item">
        <div class="place">📍 ${s.place}</div>
        <div class="time">⏰ ${s.time || "请确认"}${s.closed ? " · 休：" + s.closed : ""}</div>
        <a class="nav-btn" href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}" target="_blank">导航</a>
      </div>
    `).join("");
    const eventsHtml = (c.events || []).map(e => `
      <div class="event-item">
        <div class="title">🎉 ${e.title}</div>
        <div class="detail">${e.detail || ""}</div>
        ${e.link ? `<a class="link-btn" href="${e.link}" target="_blank">查看活动</a>` : ""}
      </div>
    `).join("");
    return `
      <div class="card" data-no="${c.no}" onclick="selectCastle(${c.no})">
        <h3>No.${c.no} ${c.name}</h3>
        <div class="meta">${c.loc} · ${c.type==='100'?'日本100名城':'続100名城'}</div>
        ${stampsHtml}
        ${eventsHtml}
        <div style="font-size:0.8rem;margin-top:6px;color:#5f6368;">
          营业：${c.hours || "请确认"} · 门票：${c.ticket || "遗迹多为免费"}
          ${c.official ? `<br><a href="${c.official}" target="_blank" style="color:#1a73e8;">官方网站</a>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

function filter() {
  const q = document.getElementById("search").value.toLowerCase();
  const region = document.getElementById("region").value;
  const type = document.getElementById("type").value;
  const filtered = castles.filter(c => {
    const matchQ = !q || c.name.toLowerCase().includes(q) || String(c.no).includes(q) || c.loc.toLowerCase().includes(q);
    const matchR = !region || c.region === region;
    const matchT = !type || c.type === type;
    return matchQ && matchR && matchT;
  });
  render(filtered);
}

document.getElementById("search").addEventListener("input", filter);
document.getElementById("region").addEventListener("change", filter);
document.getElementById("type").addEventListener("change", filter);

render(castles);
</script>
</body>
</html>
