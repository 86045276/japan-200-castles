  .kicker{font-size:0.75rem;letter-spacing:0.08em;color:#6e6a64;margin-bottom:2px;}
  .updated{font-size:0.75rem;color:#6e6a64;margin-top:4px;}

  #search:focus{border-color:var(--accent);}
  .filters{display:flex;gap:8px;margin-top:10px;}
  .filters select{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:0.85rem;}
  #list{flex:1;overflow-y:auto;padding:8px;}
  .card{padding:12px;border-radius:8px;margin-bottom:6px;cursor:pointer;border:1px solid transparent;}
  .card:hover,.card.active{background:var(--hover);border-color:var(--border);}
  .card h3{font-size:1rem;font-weight:500;margin-bottom:4px;}
  .meta{color:var(--muted);font-size:0.8rem;margin-bottom:6px;}
  .stamp-item,.event-item{background:#e8f0fe;border-radius:6px;padding:8px 10px;margin:4px 0;font-size:0.85rem;}
  .event-item{background:#fff4e6;}
  .nav-btn,.link-btn,.been-btn{display:inline-block;margin-top:4px;margin-right:6px;padding:4px 10px;background:var(--accent);color:white;border:none;border-radius:16px;font-size:0.75rem;text-decoration:none;cursor:pointer;}
  .been-btn{margin-top:0;background:#fff;color:var(--muted);border:1px solid var(--border);}
  .been-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .card-top{display:flex;align-items:flex-start;gap:8px;}
  .card-top h3{flex:1;}
  .set-wrap{position:relative;flex:0 0 auto;}
  #settingsBtn{height:100%;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;font-size:0.85rem;cursor:pointer;white-space:nowrap;}
  #settingsBtn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  #settings{display:none;flex:1;overflow:auto;padding:12px 16px;}
  #settings.open{display:block;}
  #list.off,#sidebar-header.off,.notice.off{display:none;}
  #detail{display:none;flex:1;min-height:0;overflow:auto;padding:16px 16px 24px;}
  #detail.open{display:block;}
  #detail h2{font-family:"Noto Serif SC",serif;font-size:1.6rem;font-weight:500;letter-spacing:-0.02em;}
  .back{border:0;background:none;cursor:pointer;font-size:0.9rem;padding:8px 0;}
  .poi{display:inline-block;margin-top:12px;padding:10px 14px;background:#1a1a1a;color:#fff;border-radius:8px;text-decoration:none;font-size:0.9rem;}
  .block{margin-top:20px;}
  .block h3{font-size:0.9rem;font-weight:500;}
  .block p{margin-top:4px;font-size:0.9rem;color:#1a1a1a;}
  .muted{color:#6e6a64;font-size:0.8rem;}
  .scope-row,.suggest{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:8px;}
  .scope-row button{flex:1;border:0;background:#fff;padding:8px 4px;cursor:pointer;font-size:0.85rem;}
  .scope-row button.on{background:var(--accent);color:#fff;}
  .field{width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.9rem;}
  .suggest{flex-direction:column;margin-top:8px;}
  .suggest button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:#fff;padding:8px 10px;cursor:pointer;font-size:0.85rem;}
  .suggest button:last-child{border-bottom:0;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chips button{border:0;background:#e8f0fe;border-radius:16px;padding:4px 10px;cursor:pointer;font-size:0.75rem;}
  .sec{margin-top:16px;font-size:0.9rem;font-weight:500;}
  .hint{color:var(--muted);font-size:0.75rem;font-weight:400;margin-top:4px;}
  .set-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);margin-top:4px;padding-top:8px;font-size:0.75rem;color:var(--muted);}
  .set-foot button{border:0;background:none;color:var(--accent);cursor:pointer;font-size:0.75rem;}
  .link-btn{background:#d97706;}
  #map{flex:1;height:100%;}
  .notice{font-size:0.75rem;color:var(--muted);padding:8px 16px;background:#fff8e1;border-top:1px solid var(--border);}
  @media(max-width:768px){#sidebar{top:auto;left:0;right:0;bottom:0;width:auto;height:52vh;border-radius:24px 24px 0 0;}}
</style>
</head>

    <div class="sec">加入筛选</div>

  </div>

const map = L.map('map', { zoomControl: false }).setView([36.5, 138], 5);
function googleTiles(lyrs) {
  return L.tileLayer('https://mt{s}.google.com/vt/lyrs=' + lyrs + '&hl=zh-CN&gl=JP&x={x}&y={y}&z={z}', {
    subdomains: ['0','1','2','3'],
    maxZoom: 20,
    attribution: '地图数据 &copy; Google'
  });
}
let gTiles = googleTiles('m').addTo(map);
const styleCtl = L.control({position:'topright'});
styleCtl.onAdd = function() {
  const div = L.DomUtil.create('div');
  div.style.cssText = 'display:flex;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:13px;';
  const modes = [['m','地图'],['s','卫星'],['y','混合']];
  modes.forEach(([k,label], i) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.dataset.k = k;
    b.style.cssText = 'border:0;background:' + (k==='m'?'#1a1a1a':'#fff') + ';color:' + (k==='m'?'#fff':'#202124') + ';padding:8px 12px;cursor:pointer;' + (i?'border-left:1px solid #dadce0':'');
    b.onclick = function(ev) {
      L.DomEvent.stop(ev);
      map.removeLayer(gTiles);
      gTiles = googleTiles(k).addTo(map);
      div.querySelectorAll('button').forEach(x => {
        const on = x.dataset.k === k;
        x.style.background = on ? '#1a1a1a' : '#fff';
        x.style.color = on ? '#fff' : '#202124';
      });
    };
    div.appendChild(b);
  });
  L.DomEvent.disableClickPropagation(div);
  return div;
};
styleCtl.addTo(map);
L.control.zoom({ position: 'topright' }).addTo(map);

let scope = "rest";
const markers = {};
const PICK_KEY = "castle-picked-v1";
const VISITED_KEY = "castle-visited-v1";
const SCOPE_KEY = "castle-scope-v1";
let picked = new Set();

function suggestionsFor(text){
  const q = text.trim().toLowerCase();
  if(!q) return [];
  const tokens = q.split(/[\s,，、]+/).filter(Boolean);
  if(tokens.length > 1 && tokens.every(token => /^\d+$/.test(token))){
    return castles.filter(c => tokens.includes(String(c.no)));
  }
  return castles.filter(c => c.name.toLowerCase().includes(q) || String(c.no).startsWith(q)).slice(0, 8);
}
function loadStore(){
  try{
    const raw = localStorage.getItem(PICK_KEY) || localStorage.getItem(VISITED_KEY);
    const v = JSON.parse(raw || "[]");
    if(Array.isArray(v)) picked = new Set(v.filter(n => typeof n === "number"));
    const saved = localStorage.getItem(SCOPE_KEY);
    if(saved === "all" || saved === "picked" || saved === "rest") scope = saved;
  }catch(e){}
  paintSettings();
}
function savePicked(){ localStorage.setItem(PICK_KEY, JSON.stringify([...picked])); }
function paintSettings(){
  document.querySelectorAll("#scopeBtns button").forEach(btn => {
    const on = btn.dataset.k === scope;
    btn.classList.toggle("on", on);
  });
  const open = document.getElementById("settings").classList.contains("open");
  const settingsBtn = document.getElementById("settingsBtn");
  settingsBtn.textContent = open ? "完成" : (picked.size ? "设置 " + picked.size : "设置");
  settingsBtn.classList.toggle("on", open || picked.size > 0);
  const chosen = castles.filter(c => picked.has(c.no)).sort((a,b) => a.no - b.no);
  document.getElementById("pickedTitle").textContent = "已筛选 " + chosen.length;
  document.getElementById("pickedEmpty").style.display = chosen.length ? "none" : "block";
  document.getElementById("clearPicked").style.visibility = chosen.length ? "visible" : "hidden";
  document.getElementById("pickedChips").innerHTML = chosen.map(c => `<button type="button" onclick="removePicked(${c.no})">No.${c.no} ${c.name} ×</button>`).join("");
  const q = document.getElementById("pickInput").value;
  const box = document.getElementById("suggest");
  const matches = suggestionsFor(q);
  if(!q.trim()){ box.innerHTML = ""; return; }
  if(!matches.length){ box.innerHTML = '<div class="hint">没有匹配的城</div>'; return; }
  box.innerHTML = `<div class="suggest">${matches.map(c => {
    const on = picked.has(c.no);
    return `<button type="button" onclick="${on ? `removePicked(${c.no})` : `addPicked([${c.no}])`}">No.${c.no} ${c.name}<span style="color:${on ? "#5f6368" : "#1a1a1a"}">${on ? "移除" : "加入"}</span></button>`;
  }).join("")}</div>`;
}

function syncMarkers(list){
  Object.keys(markers).forEach(k => { map.removeLayer(markers[k]); delete markers[k]; });
  list.forEach(c => {
    if(!(c.lat && c.lng)) return;
    const hollow = scope === "all" && picked.has(c.no);
    const icon = L.divIcon({
      className: "",
      html: `<span style="display:block;width:14px;height:14px;border-radius:50%;background:${hollow?"#fff":"#1a1a1a"};border:2px solid ${hollow?"#1a1a1a":"#fff"};box-shadow:0 1px 3px rgba(0,0,0,.35)"></span>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });
    const m = L.marker([c.lat, c.lng], {icon, title: c.name}).addTo(map);
    markers[c.no] = m;
    m.on("click", () => selectCastle(c.no));
  });
}

let detailNo = null;
function closeDetail(){
  detailNo = null;
  document.getElementById("detail").classList.remove("open");
  document.getElementById("detail").innerHTML = "";
  document.getElementById("sidebar-header").classList.remove("off");
  document.getElementById("list").classList.remove("off");
  document.getElementById("countline").classList.remove("off");
}
function selectCastle(no){
  const c = castles.find(x => x.no === no);
  if(!c) return;
  detailNo = no;
  document.getElementById("settings").classList.remove("open");
  document.getElementById("list").classList.add("off");
  document.getElementById("sidebar-header").classList.add("off");
  document.getElementById("countline").classList.add("off");
  const v = visitOf(c);
  const stamps = (c.stamps||[]).map(s => `<div class="block" style="margin-top:12px;"><p>${s.place}</p><p class="muted">${s.time||"请确认"}</p></div>`).join("");
  const events = (c.events||[]).map(e => `<div class="block" style="margin-top:12px;"><p>${e.title}</p>${e.detail?`<p class="muted">${e.detail}</p>`:""}${e.link?`<p><a href="${e.link}" target="_blank">查看活动</a></p>`:""}</div>`).join("");
  document.getElementById("detail").innerHTML = `<button type="button" class="back" onclick="closeDetail()">返回</button>
    <p class="muted">No.${c.no} · ${c.type==="100"?"日本100名城":"続100名城"} · ${c.region}</p>
    <h2>${c.name}</h2>
    <p class="muted">${c.loc}</p>
    <a class="poi" href="${poiUrl(c)}" target="_blank">导航到这座城</a>
    <div class="block"><h3>营业</h3><p>${v.hours}</p>${v.closed?`<p class="muted">休馆 ${v.closed}</p>`:""}<p class="muted">门票 ${c.ticket||"遗迹多为免费"}</p></div>
    <div class="block"><h3>盖章</h3>${stamps}</div>
    ${events?`<div class="block"><h3>近期活动</h3>${events}</div>`:""}
    ${c.official?`<div class="block"><a href="${c.official}" target="_blank">官方网站</a></div>`:""}
    <p class="muted" style="margin-top:20px;">休馆多指天守和资料馆。出发前请再看官方。</p>`;
  document.getElementById("detail").classList.add("open");
  if(markers[no]) map.setView([c.lat, c.lng], 13);
}
function addPicked(nos){
  nos.forEach(no => picked.add(no));
  savePicked();
  document.getElementById("pickInput").value = "";
  filter();
}
function removePicked(no){
  picked.delete(no);
  savePicked();
  filter();
}
function clearPicked(){
  picked = new Set();
  savePicked();
  filter();
}

function poiUrl(c){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(c.name + " " + c.loc);
}
function visitOf(c){
  return VISIT[c.no] || { hours: c.hours || "请确认", closed: "" };
}
function render(list){
  const el = document.getElementById("list");
  document.getElementById("countline").textContent = "当前 " + list.length + " 座 · 已筛选 " + picked.size + " 座。休馆多指天守和资料馆，户外遗迹往往还能进。";
  paintSettings();
  if(!list.length){
    const msg = scope === "picked" && picked.size === 0
      ? "还没有筛选。打开「设置」，输入城号或城名。"
      : "没有符合条件的城。到设置里可以改成「全部」或「筛选的」。";
    el.innerHTML = `<div style="padding:20px;text-align:center;color:#5f6368;">${msg}</div>`;
    syncMarkers(list);
    return;
  }
  el.innerHTML = list.map(c => {
    const on = picked.has(c.no);
    const closedShort = visitOf(c).closed;
    const tag = closedShort && !closedShort.startsWith("无每周") ? closedShort.split("、")[0] : "";
    return `<button type="button" class="card" data-no="${c.no}" onclick="selectCastle(${c.no})" style="display:block;width:100%;text-align:left;background:transparent;"><h3 style="${on?"color:#5f6368":""}">No.${c.no} ${c.name}</h3><div class="meta">${c.loc}${tag?" · "+tag:""}${on?" · 已筛选":""}</div></button>`;
  }).join("");
  syncMarkers(list);
}

function filter(){
  const q = document.getElementById("search").value.toLowerCase();
  const region = document.getElementById("region").value;
  const type = document.getElementById("type").value;
  const filtered = castles.filter(c => {
    const matchQ = !q || c.name.toLowerCase().includes(q) || String(c.no).includes(q) || c.loc.toLowerCase().includes(q);
    const matchR = !region || c.region === region;
    const matchT = !type || c.type === type;
    const matchScope = scope === "all" || (scope === "picked" ? picked.has(c.no) : !picked.has(c.no));
    return matchQ && matchR && matchT && matchScope;
  });
  render(filtered);
  if(detailNo && !filtered.some(c => c.no === detailNo)) closeDetail();
}

document.getElementById("search").addEventListener("input", filter);
document.getElementById("region").addEventListener("change", filter);
document.getElementById("type").addEventListener("change", filter);
document.getElementById("settingsBtn").addEventListener("click", () => {
  const panel = document.getElementById("settings");
  const list = document.getElementById("list");
  panel.classList.toggle("open");
  list.classList.toggle("off");
  paintSettings();
  if(panel.classList.contains("open")) document.getElementById("pickInput").focus();
});
document.getElementById("scopeBtns").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button");
  if(!btn) return;
  scope = btn.dataset.k;
  localStorage.setItem(SCOPE_KEY, scope);
  filter();
});
document.getElementById("pickInput").addEventListener("input", paintSettings);
document.getElementById("pickInput").addEventListener("keydown", (ev) => {
  if(ev.key !== "Enter") return;
  ev.preventDefault();
  const matches = suggestionsFor(ev.target.value);
  if(!matches.length) return;
  const tokens = ev.target.value.trim().split(/[\s,，、]+/).filter(Boolean);
  const nos = tokens.length > 1 && tokens.every(token => /^\d+$/.test(token)) ? matches.map(c => c.no) : [matches[0].no];
  addPicked(nos);
});
document.getElementById("clearPicked").addEventListener("click", clearPicked);

loadStore();
filter();
</script>
